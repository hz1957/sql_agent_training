dry_run: false

ray:
  # 2-GPU placement: rollout/vLLM and reference share one physical GPU
  # through Ray fractional GPU resources; learner uses the second GPU.
  # For 3-GPU placement, set reference_colocate_with_rollout: false and
  # rollout_num_gpus/reference_num_gpus/learner_num_gpus all to 1.
  reference_colocate_with_rollout: true
  rollout_num_gpus: 0.5
  reference_num_gpus: 0.5
  learner_num_gpus: 1
  rollout_device: "cuda:0"
  reference_device: "cuda:0"
  learner_device: "cuda:0"
  vllm_gpu_memory_utilization: 0.45
  # Local port for the vLLM OpenAI-compatible server
  vllm_port: 8100

model:
  backend: vllm
  path: data/models/Qwen2.5-Coder-14B-Instruct
  # Path to SFT LoRA checkpoint to start GRPO from
  adapter_path: artifacts/checkpoints/sft_qwen25_coder_14b_lora_h100_zero2/20260725_061113/checkpoint-300
  torch_dtype: bf16
  # Uncomment if GPU 0 runs out of memory (reference model on GPU 0):
  # reference_load_in_8bit: true

tokenizer:
  kind: hf

data:
  data_dir: data/spider
  train_file: train_spider.json
  validation_file: dev.json

rollout:
  n: 4
  max_turns: 3
  max_prompt_length: 4096
  max_response_length: 2048
  temperature: 0.8
  top_p: 0.95

output:
  include_text: true
  checkpoint_dir: artifacts/checkpoints/grpo_ray_14b_lora

eval:
  sample_size: 500
  sample_seed: 0

training:
  seed: 0
  max_steps: 500
  update_epochs: 1
  task_batch_size: 8
  transition_reward_mode: discounted_final
  transition_reward_gamma: 0.4
  learning_rate: 0.0000005
  clip_epsilon: 0.2
  kl_beta: 0.01
  normalize_advantages: true
  max_grad_norm: 1.0
  logprob_micro_batch_size: 1
  save_every_steps: 25
