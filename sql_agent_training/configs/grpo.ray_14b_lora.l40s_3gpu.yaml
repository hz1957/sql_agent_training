dry_run: false

ray:
  # 3x L40S placement:
  # GPU0: RolloutActor/vLLM
  # GPU1: ReferenceLogprobWorker
  # GPU2: LearnerWorker
  reference_colocate_with_rollout: false
  rollout_num_gpus: 1
  reference_num_gpus: 1
  learner_num_gpus: 1
  rollout_device: "cuda:0"
  reference_device: "cuda:0"
  learner_device: "cuda:0"
  vllm_gpu_memory_utilization: 0.82
  vllm_port: 8100

model:
  backend: vllm
  path: data/models/Qwen2.5-Coder-14B-Instruct
  adapter_path: artifacts/checkpoints/sft_qwen25_coder_14b_lora_h100_zero2/20260725_061113/checkpoint-300
  torch_dtype: bf16

tokenizer:
  kind: hf

data:
  data_dir: data/spider
  train_file: train_spider.json
  validation_file: dev.json

rollout:
  n: 4
  max_turns: 3
  max_prompt_length: 4096
  max_response_length: 1024
  temperature: 0.8
  top_p: 0.95

output:
  include_text: true
  checkpoint_dir: artifacts/checkpoints/grpo_ray_14b_lora_l40s_3gpu

eval:
  sample_size: 500
  sample_seed: 0

training:
  seed: 0
  max_steps: 500
  update_epochs: 1
  task_batch_size: 4
  transition_reward_mode: discounted_final
  transition_reward_gamma: 0.4
  learning_rate: 0.0000005
  clip_epsilon: 0.2
  kl_beta: 0.01
  normalize_advantages: true
  max_grad_norm: 1.0
  logprob_micro_batch_size: 1
  save_every_steps: 25
