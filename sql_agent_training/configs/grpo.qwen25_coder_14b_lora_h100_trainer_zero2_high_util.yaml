dry_run: false

model:
  backend: hf
  path: data/models/Qwen2.5-Coder-14B-Instruct
  adapter_root: artifacts/checkpoints/sft_qwen25_coder_14b_lora_h100_zero2
  adapter_checkpoint: checkpoint-300
  torch_dtype: bf16

tokenizer:
  kind: hf

data:
  data_dir: data/spider
  train_file: train_spider.json
  validation_file: dev.json

rollout:
  n: 4
  max_turns: 3
  max_prompt_length: 2048
  max_response_length: 512
  temperature: 0.8
  top_p: 0.95

output:
  include_text: true
  checkpoint_dir: artifacts/checkpoints/grpo_qwen25_coder_14b_lora_h100_zero2_high_util

training:
  seed: 0
  device: cuda
  max_steps: 50
  update_epochs: 3
  task_batch_size: 8
  transition_reward_mode: discounted_final
  transition_reward_gamma: 0.4
  learning_rate: 0.000001
  clip_epsilon: 0.2
  kl_beta: 0.0
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  logprob_micro_batch_size: 2
  save_every_steps: 5
  logging_steps: 1
  bf16: true
  fp16: false
  report_to: none
  deepspeed: configs/deepspeed_zero2_h100.json
