model:
  path: data/models/Qwen2.5-Coder-14B-Instruct

tokenizer:
  kind: hf

data:
  data_dir: data/spider
  train_file: train_spider.json
  validation_file: dev.json

output:
  sft_jsonl: artifacts/sft/train_qwen25_coder_14b_lora.jsonl
  checkpoint_dir: artifacts/checkpoints/sft_qwen25_coder_14b_lora_l40s_zero3

eval:
  sample_size: 500
  sample_seed: 0

training:
  max_prompt_length: 1536
  max_response_length: 256
  learning_rate: 0.00005
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  warmup_ratio: 0.03
  weight_decay: 0.0
  logging_steps: 10
  save_strategy: steps
  save_steps: 100
  bf16: true
  fp16: false
  report_to: none
  deepspeed: configs/deepspeed_zero3_l40s.json

lora:
  enabled: true
  r: 32
  alpha: 64
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
