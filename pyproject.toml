[project]
name = "sql-agent-training-workspace"
version = "0.1.0"
description = "Workspace for standalone Spider SQL agent training."
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false
conflicts = [
  [
    { package = "sql-agent-training", extra = "sft" },
    { package = "sql-agent-training", extra = "verl-cu128" },
  ],
  [
    { package = "sql-agent-training", extra = "train" },
