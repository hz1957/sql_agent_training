[project]
name = "sql-agent-training-workspace"
version = "0.1.0"
description = "Workspace for standalone Spider SQL agent training."
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false
no-build-isolation-package = ["flash-attn"]
conflicts = [
  [
    { package = "sql-agent-training", extra = "sft" },
    { package = "sql-agent-training", extra = "verl-cu126" },
  ],
  [
    { package = "sql-agent-training", extra = "train" },
    { package = "sql-agent-training", extra = "verl-cu126" },
  ],
]

[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.8.3"
requires-dist = ["einops", "torch"]

[tool.uv.workspace]
members = ["sql_agent_training"]
